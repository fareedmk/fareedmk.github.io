services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: yafi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: yafi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yafi -d yafi"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yafi:${POSTGRES_PASSWORD}@db:5432/yafi?schema=public
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yafi:${POSTGRES_PASSWORD}@db:5432/yafi?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://yafi:${POSTGRES_PASSWORD}@db:5432/yafi?schema=public
    command: ["npm", "run", "worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
